[build]
builder = "railpack"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "python -c \"import os, uvicorn; uvicorn.run('main:app', host='0.0.0.0', port=int(os.getenv('PORT', '8000')))\""
healthcheckPath = "/health"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3