name: Dashboard regression

# Every push to master deploys to Railway -- once that deploy is live, re-check that every
# dashboard page still loads.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: Dashboard URL to test (defaults to the DASHBOARD_URL repo variable / prod domain)
        required: false

# Only the newest push matters -- it supersedes whatever an older run would have tested.
concurrency:
  group: dashboard-regression
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: JobDataDashboard/regression-tests
    env:
      CI: true
      DASHBOARD_URL: ${{ inputs.dashboard_url || vars.DASHBOARD_URL || 'https://projectycjobs.buildwithadi.dev' }}
    steps:
      - uses: actions/checkout@v4

      # Railway's GitHub integration creates one deployment per pushed commit and marks it
      # success once the environment is live. Testing before then would test the old build.
      - name: Wait for Railway deploy of ${{ github.sha }}
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}"
          # Up to ~5 min for Railway to register the deploy, ~30 min in total for it to finish.
          for attempt in $(seq 1 90); do
            deployment_id=$(gh api "$api" --jq '.[0].id // empty')
            if [ -z "$deployment_id" ]; then
              if [ "$attempt" -ge 15 ]; then
                echo "::warning::Railway never created a deployment for ${GITHUB_SHA}; testing what's live."
                exit 0
              fi
              echo "No Railway deployment for ${GITHUB_SHA} yet..."
            else
              state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" --jq '.[0].state // "pending"')
              echo "Railway deployment ${deployment_id}: ${state}"
              case "$state" in
                success) exit 0 ;;
                failure|error|inactive)
                  echo "::error::Railway deployment for ${GITHUB_SHA} ended in '${state}'."
                  exit 1 ;;
              esac
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for Railway to deploy ${GITHUB_SHA}."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Run page load tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            JobDataDashboard/regression-tests/playwright-report
            JobDataDashboard/regression-tests/test-results
          retention-days: 14
