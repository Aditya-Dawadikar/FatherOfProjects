name: Dashboard regression

# Railway's GitHub integration posts a deployment status for every service deploy -- each
# successful one re-checks that every dashboard page still loads.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: Dashboard URL to test (defaults to the DASHBOARD_URL repo variable / prod domain)
        required: false

# A push to master deploys several services at once -- only the latest run matters.
concurrency:
  group: dashboard-regression
  cancel-in-progress: true

jobs:
  pages:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: JobDataDashboard/regression-tests
    env:
      CI: true
      DASHBOARD_URL: ${{ inputs.dashboard_url || vars.DASHBOARD_URL || 'https://projectycjobs.buildwithadi.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Run page load tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            JobDataDashboard/regression-tests/playwright-report
            JobDataDashboard/regression-tests/test-results
          retention-days: 14
